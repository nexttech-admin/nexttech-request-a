<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>คิวงานรอรับเรื่อง · NEXT TECH</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f5f4f8; --card: #fff; --ink: #1d1b24; --muted: #6b6878; --line: #e3e0ea; --navy: #1b3c87; --navy-soft: #e8eefb;
          --yellow: #f6c343; --cream: #fff7e0; --ok: #1e6b3a; --ok-soft: #e6f4ea; --err: #b3261e; --err-soft: #fdecea; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #141218; --card: #1e1b24; --ink: #ece9f2; --muted: #a39fae; --line: #34303d;
      --navy: #9db7f5; --navy-soft: #1f2a44; --cream: #3a3016; --ok: #8fd6a4; --ok-soft: #1b3324; --err: #f2b8b5; --err-soft: #3b1f1d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 "IBM Plex Sans Thai", system-ui, sans-serif; }
  .demo { background: #fff4dc; color: #8a5a00; text-align: center; padding: 6px 16px; font-size: 13px; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-size: 1.4rem; margin: 0; }
  .who { color: var(--muted); font-size: .92rem; }
  button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 7px 14px; }
  button.primary { background: var(--navy); border-color: var(--navy); color: #fff; font-weight: 600; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button.primary { color: #141218; } }
  button:disabled { opacity: .55; cursor: wait; }
  .login { max-width: 360px; margin: 10vh auto 0; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; text-align: center; }
  .login input { width: 100%; font: 600 1.6rem/1 ui-monospace, Menlo, monospace; letter-spacing: .5em; text-align: center; padding: 12px;
                 border: 1.5px solid var(--line); border-radius: 12px; margin: 14px 0; background: var(--bg); color: var(--ink); }
  .login button { width: 100%; padding: 11px; }
  h2 { font-size: 1.05rem; margin: 22px 0 10px; display: flex; align-items: center; gap: 8px; }
  .count { background: var(--yellow); color: #1d1b24; border-radius: 99px; padding: 0 9px; font-size: .85rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--yellow); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .card.done { border-left-color: var(--navy); }
  .top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
  .title { font-weight: 600; font-size: 1.02rem; }
  .meta { color: var(--muted); font-size: .86rem; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 16px; margin-top: 8px; font-size: .9rem; }
  @media (max-width: 620px) { .grid { grid-template-columns: 1fr; } }
  .grid span { color: var(--muted); }
  .assign { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .assign select { font: inherit; padding: 7px 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
  .by { color: var(--muted); font-size: .8rem; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .panel input { font: 600 1.1rem ui-monospace, Menlo, monospace; letter-spacing: .3em; width: 150px; padding: 8px 10px; border: 1.5px solid var(--line);
                 border-radius: 10px; background: var(--bg); color: var(--ink); text-align: center; }
  .panel input::placeholder { letter-spacing: normal; font: 400 .95rem "IBM Plex Sans Thai", sans-serif; }
  .log { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; font-size: .86rem; }
  .log th, .log td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .log th { color: var(--muted); font-weight: 600; background: var(--bg); }
  .log tr:last-child td { border-bottom: 0; }
  .owner { display: inline-block; background: var(--navy-soft); color: var(--navy); border-radius: 99px; padding: 1px 10px; font-weight: 600; font-size: .85rem; }
  .empty { color: var(--muted); background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 18px; text-align: center; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); max-width: 90vw; padding: 10px 16px; border-radius: 10px; font-weight: 500; }
  .toast.ok { background: var(--ok-soft); color: var(--ok); } .toast.err { background: var(--err-soft); color: var(--err); }
  .err { color: var(--err); min-height: 1.4em; }
  a { color: var(--navy); font-weight: 600; }
  .meName { color: var(--accent); font-weight: 700; font-size: 1.05em; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="login hidden" id="login">
  <h1>คิวงานรอรับเรื่อง</h1>
  <p class="who">ใส่ PIN ประจำตัวของคุณ (ใส่ครั้งเดียว เครื่องนี้จะจำไว้)</p>
  <input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" aria-label="PIN">
  <div class="err" id="loginErr"></div>
  <button class="primary" id="loginBtn">เข้าสู่คิวงาน</button>
</div>

<div class="wrap hidden" id="app">
  <header>
    <div>
      <h1>คิวงานรอรับเรื่อง</h1>
      <div class="who" id="me"></div>
    </div>
    <div style="display:flex;gap:8px">
      <button id="refresh">รีเฟรช</button>
      <button id="changePinBtn">เปลี่ยน PIN</button>
      <button id="teamPinBtn" class="hidden">จัดการ PIN ทีม</button>
      <button id="logout">ออกจากระบบ</button>
    </div>
  </header>
  <div class="panel hidden" id="pinPanel">
    <div style="font-weight:600;margin-bottom:6px">ตั้ง PIN ใหม่ (ตัวเลข 6 หลัก)</div>
    <div class="assign">
      <input id="newPin1" inputmode="numeric" maxlength="6" placeholder="PIN ใหม่" aria-label="PIN ใหม่">
      <input id="newPin2" inputmode="numeric" maxlength="6" placeholder="อีกครั้ง" aria-label="ยืนยัน PIN ใหม่">
      <button class="primary" id="savePin">บันทึก</button>
      <button id="cancelPin">ยกเลิก</button>
    </div>
    <div class="err" id="pinErr"></div>
  </div>
  <div class="panel hidden" id="teamPanel">
    <div style="font-weight:600">จัดการ PIN ทีม <span class="meta">(เฉพาะผู้ดูแล · ระบบไม่แสดง PIN เดิมของใคร)</span></div>
    <div id="teamRows" style="display:grid;gap:8px;margin-top:10px"></div>
    <div class="err" id="teamErr"></div>
  </div>
  <h2>รอรับเรื่อง <span class="count" id="pendingCount">0</span></h2>
  <div id="pending"></div>
  <h2>รับเรื่องแล้ว (ล่าสุด)</h2>
  <div id="claimed"></div>
  <h2>บันทึกการใช้งาน (ล่าสุด)</h2>
  <div style="overflow-x:auto"><table class="log"><thead><tr><th>เวลา</th><th>ผู้ใช้ (ตาม PIN)</th><th>การกระทำ</th><th>รายละเอียด</th></tr></thead>
    <tbody id="activity"></tbody></table></div>
  <p class="meta" id="updated"></p>
</div>
<div class="toast hidden" id="toast"></div>

<script>
var API_URL = "https://script.google.com/macros/s/AKfycbzb4Q86ODKGuftrx3pFy8ASfUJ2Z1BnO8FA0k5_UFySg9CkOw5YCTe8-6tDMAgH4pimEQ/exec"; // ว่าง = เปิดผ่านลิงก์ Apps Script (google.script.run) · ใส่ URL /exec ถ้าโฮสต์ภายนอก
(function () {
  var KEY = 'nexttech-dashboard-pin';
  var $ = function (s) { return document.querySelector(s); };
  var pin = '';
  try { pin = localStorage.getItem(KEY) || ''; } catch (e) {}
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function call(fn, args) {
    if (!API_URL) return new Promise(function (ok, no) { google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn].apply(null, args); });
    return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
      .then(function (r) { return r.json(); }).then(function (res) { if (res.error) throw new Error(res.error); return res.result; });
  }
  function toast(kind, text) {
    var t = $('#toast'); t.className = 'toast ' + kind; t.textContent = text;
    clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.add('hidden'); }, 4000);
  }
  function showLogin(err) {
    $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
    $('#loginErr').textContent = err || ''; $('#pin').value = ''; $('#pin').focus();
  }
  function row(label, value) { return value ? '<div><span>' + label + '</span> ' + esc(value) + '</div>' : ''; }
  function card(x, pending) {
    return '<div class="card' + (pending ? '' : ' done') + '">' +
      '<div class="top"><div><div class="title">' + esc(x.eventName) + '</div>' +
      '<div class="meta">' + esc(x.id) + ' · ส่งเมื่อ ' + esc(x.submittedAt) + '</div></div>' +
      (pending ? '<div class="assign"><select aria-label="ผู้รับเรื่อง" data-owner-for="' + esc(x.id) + '">' + ownerOptions() + '</select>' +
                 '<button class="primary" data-claim="' + esc(x.id) + '" data-name="' + esc(x.eventName) + '">ยืนยันผู้รับเรื่อง</button></div>'
               : '<div style="text-align:right"><span class="owner">' + esc(x.ownerName) + '</span><div class="meta">' + esc(x.claimedAt) + '</div>' +
                 (x.assignedBy ? '<div class="by">รับแจ้งเรื่องโดย ' + esc(x.assignedBy) + '</div>' : '') + '</div>') +
      '</div><div class="grid">' +
      row('วันที่จัดงาน', x.eventDate) + row('สถานที่', x.venue) + row('ผู้จัดงาน', x.organizer) + row('ผู้ประสานงาน', x.coordinator) +
      row('Set up', x.setup) + row('รื้อถอน', x.teardown) + row('ค่าประกัน', x.depositLabel) + row('อีเมลลูกค้า', x.contactEmail) +
      row('อุปกรณ์', x.equipment) + row('บริการ', x.services) +
      (x.fileUrl ? '<div><span>ไฟล์</span> <a href="' + esc(x.fileUrl) + '" target="_blank" rel="noopener">เปิดใบแจ้งงาน</a></div>' : '') +
      '</div></div>';
  }
  var ME = null, OWNERS = [];
  function ownerOptions() {
    var pre = ME && ME.canOwn ? ME.key : '';
    return (pre ? '' : '<option value="">— เลือกผู้รับเรื่อง —</option>') + OWNERS.map(function (o) {
      return '<option value="' + esc(o.key) + '"' + (o.key === pre ? ' selected' : '') + '>' + esc(o.name) + '</option>';
    }).join('');
  }
  function render(res) {
    ME = res.me; OWNERS = res.owners || [];
    $('#teamPinBtn').classList.toggle('hidden', !res.me.isPinAdmin);
    if (!res.me.isPinAdmin) $('#teamPanel').classList.add('hidden');
    if (res.me.isPinAdmin && !$('#teamRows').children.length) {
      $('#teamRows').innerHTML = (res.users || []).map(function (u) {
        return '<div class="assign"><div style="min-width:220px">' + esc(u.name) + '</div>' +
          '<input inputmode="numeric" maxlength="6" placeholder="PIN ใหม่ 6 หลัก" data-pin-for="' + esc(u.key) + '" aria-label="PIN ใหม่ของ ' + esc(u.name) + '">' +
          '<button class="primary" data-set-pin="' + esc(u.key) + '" data-name="' + esc(u.name) + '">ตั้ง PIN ใหม่</button></div>';
      }).join('');
    }
    var keep = {};  // auto-refresh must not reset a choice someone is making
    document.querySelectorAll('[data-owner-for]').forEach(function (s) { if (s.value) keep[s.dataset.ownerFor] = s.value; });
    $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
    $('#me').innerHTML = 'เข้าใช้งานในชื่อ <b class="meName">' + esc(res.me.name) + '</b> — เลือกผู้รับเรื่องแล้วกดยืนยัน ชื่อผู้รับเรื่องจะลงในใบแจ้งงานคู่กับคุณกมลเทพ';
    $('#pendingCount').textContent = res.pending.length;
    $('#pending').innerHTML = res.pending.length ? res.pending.map(function (x) { return card(x, true); }).join('')
      : '<div class="empty">ไม่มีงานรอรับเรื่อง 🎉</div>';
    Object.keys(keep).forEach(function (id) {
      var s = document.querySelector('[data-owner-for="' + id + '"]'); if (s) s.value = keep[id];
    });
    $('#claimed').innerHTML = res.claimed.length ? res.claimed.map(function (x) { return card(x, false); }).join('')
      : '<div class="empty">ยังไม่มีงานที่รับเรื่อง</div>';
    var act = res.activity || [];
    $('#activity').innerHTML = act.length ? act.map(function (a) {
      return '<tr><td>' + esc(a.at) + '</td><td>' + esc(a.user) + '</td><td>' + esc(a.action) + '</td><td>' + esc(a.detail) + '</td></tr>';
    }).join('') : '<tr><td colspan="4" class="meta">ยังไม่มีบันทึก</td></tr>';
    $('#updated').textContent = 'อัปเดตล่าสุด ' + new Date().toLocaleTimeString('th-TH') + ' · รีเฟรชอัตโนมัติทุก 1 นาที';
  }
  function load(quiet) {
    if (!pin) return showLogin();
    if (!quiet) $('#refresh').disabled = true;
    return call('dashboardList', [pin]).then(function (res) { render(res); })
      .catch(function (e) {
        var m = e.message || String(e);
        if (/PIN/.test(m)) { pin = ''; try { localStorage.removeItem(KEY); } catch (x) {} return showLogin(m); }
        toast('err', 'โหลดคิวงานไม่สำเร็จ: ' + m);
      }).then(function () { $('#refresh').disabled = false; });
  }
  $('#loginBtn').onclick = function () {
    var v = $('#pin').value.trim();
    if (!/^\d{4,8}$/.test(v)) return showLogin('กรุณาใส่ PIN เป็นตัวเลข');
    var btn = this; btn.disabled = true; $('#loginErr').textContent = '';
    call('dashboardList', [v, true]).then(function (res) {
      pin = v; try { localStorage.setItem(KEY, v); } catch (e) {}
      render(res);
    }).catch(function (e) { showLogin(e.message || String(e)); }).then(function () { btn.disabled = false; });
  };
  $('#pin').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('#loginBtn').click(); });
  $('#refresh').onclick = function () { load(false); };
  $('#teamPinBtn').onclick = function () { $('#teamPanel').classList.toggle('hidden'); $('#teamErr').textContent = ''; };
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-set-pin]');
    if (!b) return;
    var key = b.dataset.setPin, input = document.querySelector('[data-pin-for="' + key + '"]'), v = input.value.trim();
    if (!/^\d{6}$/.test(v)) return ($('#teamErr').textContent = 'PIN ใหม่ของ ' + b.dataset.name + ' ต้องเป็นตัวเลข 6 หลัก');
    if (!confirm('ตั้ง PIN ใหม่ให้ ' + b.dataset.name + ' ?\nPIN เดิมของคนนี้จะใช้ไม่ได้ทันที')) return;
    b.disabled = true; $('#teamErr').textContent = '';
    call('dashboardAdminSetPin', [pin, key, v]).then(function (res) {
      if (!res.ok) { $('#teamErr').textContent = res.error; return; }
      input.value = '';
      if (ME && key === ME.key) { pin = v; try { localStorage.setItem(KEY, v); } catch (x) {} }
      toast('ok', 'ตั้ง PIN ใหม่ให้ ' + res.name + ' เรียบร้อย');
      load(true);
    }).catch(function (err) { $('#teamErr').textContent = err.message || String(err); }).then(function () { b.disabled = false; });
  });
  $('#changePinBtn').onclick = function () { $('#pinPanel').classList.toggle('hidden'); $('#pinErr').textContent = ''; $('#newPin1').focus(); };
  $('#cancelPin').onclick = function () { $('#pinPanel').classList.add('hidden'); $('#newPin1').value = $('#newPin2').value = ''; };
  $('#savePin').onclick = function () {
    var a = $('#newPin1').value.trim(), c = $('#newPin2').value.trim();
    if (!/^\d{6}$/.test(a)) return ($('#pinErr').textContent = 'PIN ใหม่ต้องเป็นตัวเลข 6 หลัก');
    if (a !== c) return ($('#pinErr').textContent = 'PIN สองช่องไม่ตรงกัน');
    var btn = this; btn.disabled = true;
    call('dashboardChangePin', [pin, a]).then(function (res) {
      if (!res.ok) { $('#pinErr').textContent = res.error; return; }
      pin = a; try { localStorage.setItem(KEY, a); } catch (e) {}
      $('#cancelPin').click(); toast('ok', 'เปลี่ยน PIN เรียบร้อย ครั้งหน้าใช้ PIN ใหม่');
    }).catch(function (e) { $('#pinErr').textContent = e.message || String(e); }).then(function () { btn.disabled = false; });
  };
  $('#logout').onclick = function () {
    var old = pin; pin = ''; try { localStorage.removeItem(KEY); } catch (e) {}
    if (old) call('dashboardLogout', [old]).catch(function () {});
    showLogin();
  };
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-claim]');
    if (!b) return;
    var sel = document.querySelector('[data-owner-for="' + b.dataset.claim + '"]');
    if (!sel || !sel.value) return toast('err', 'กรุณาเลือกผู้รับเรื่องก่อน');
    var ownerName = sel.options[sel.selectedIndex].text;
    if (!confirm('ให้ ' + ownerName + ' เป็นผู้รับเรื่อง “' + b.dataset.name + '” ?\nระบบจะสร้างใบแจ้งงานและส่งให้ลูกค้าทันที')) return;
    b.disabled = true; b.textContent = 'กำลังสร้างใบแจ้งงาน…';
    call('dashboardClaim', [pin, b.dataset.claim, sel.value]).then(function (res) {
      if (res.ok) toast('ok', 'บันทึก ' + ownerName + ' เป็นผู้รับเรื่องเรียบร้อย ส่งใบแจ้งงานให้ลูกค้าแล้ว');
      else if (res.already) toast('err', 'งานนี้รับเรื่องไปแล้วโดย ' + res.request.ownerName);
      else toast('err', res.error || 'รับเรื่องไม่สำเร็จ');
      return load(true);
    }).catch(function (e) { toast('err', e.message || String(e)); load(true); });
  });
  setInterval(function () { if (pin && !document.hidden) load(true); }, 60000);
  load(false);
})();
</script>
</body>
</html>
